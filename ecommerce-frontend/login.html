<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Furnii Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">🛋️</span>
                <span class="logo-text">Furnii</span>
            </a>

            <div class="search-bar">
                <div class="search-wrapper">
                    <input type="text" class="search-input" placeholder="Search for furniture, decor, and more...">
                    <span class="search-icon">🔍</span>
                </div>
            </div>

            <div class="header-actions">
                <a href="register.html" class="header-link">Sign Up</a>
                <a href="products.html" class="header-link">Browse</a>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <div class="nav-content">
            <a href="index.html">Home</a>
            <a href="products.html">All Products</a>
            <a href="login.html" class="active">Sign In</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="form-page">
        <div class="form-container">
            <h2 class="form-title">Welcome Back!</h2>
            <p class="form-subtitle">Login to your account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="your.email@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Enter your password">
                </div>

                <div id="message" class="message" style="display:none;"></div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <p class="form-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Furnii. All rights reserved. | Premium Furniture Store</p>
        </div>
    </footer>

    <script>
        const API_URL = 'http://localhost:5000';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = 'Logging in...';
            messageDiv.className = 'message info';
            messageDiv.style.display = 'block';

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.textContent = '✅ Login successful! Redirecting...';
                    messageDiv.className = 'message success';
                    
                    localStorage.setItem('user', JSON.stringify(data.data));
                    localStorage.setItem('userId', data.data.id);
                    
                    setTimeout(() => {
                        window.location.href = 'products.html';
                    }, 1000);
                } else {
                    messageDiv.textContent = '❌ ' + (data.message || 'Login failed');
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = '❌ Error: Unable to connect to server. Make sure backend is running.';
                messageDiv.className = 'message error';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
